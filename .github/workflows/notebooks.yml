name: CPU notebooks

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install lab dependencies
        run: pip install -r requirements.txt
      - name: Register the notebook kernel
        run: python -m ipykernel install --user --name python3
      - name: Unit tests
        run: python -m pytest -q
      - name: Execute CPU notebooks
        run: python scripts/execute_notebooks.py --timeout 240
